# M10: no udev autoload for the USB Wi-Fi drivers (the 8821cu has its own
# file, 8821cu-no-autoload.conf). The network worker picks one module per
# dongle (vendor Realtek drivers before the mainline ones that claim the
# same IDs) and loads it with an explicit modprobe, which a blacklist
# doesn't block; the menu's Wi-Fi off keeps it unloaded. 8188fu is built in.
blacklist 88x2bu
blacklist rtl8812au
blacklist 8188eu
blacklist 8192cu
blacklist 8723bu
blacklist rtl8192cu
blacklist mt7601u
blacklist rt2800usb
blacklist rt73usb
blacklist rt2500usb
blacklist r8712u
blacklist r8723au
blacklist rtl8187
