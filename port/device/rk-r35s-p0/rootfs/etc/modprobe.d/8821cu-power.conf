# M3e step 2: Wi-Fi power save for the 8821cu dongle (the module defaults
# to rtw_power_mgnt=0). Menu idle 546 -> 454 mA (Wi-Fi off: 397 mA); costs
# some SSH latency (ping avg ~12 ms, max ~90 ms), not throughput (~6 MB/s).
# The network worker loads the module with plain `modprobe 8821cu`.
options 8821cu rtw_power_mgnt=1 rtw_ips_mode=1
