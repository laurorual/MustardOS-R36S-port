# M4c: no udev autoload for the 8821cu dongle. After a warm reboot the
# dongle is still in Wi-Fi mode (0bda:c820), so udev bound the driver at
# ~6 s, before the network worker's USB reset; the reset under the bound
# driver left the firmware failing `_btmpoper_cmd: Didn't get H2C Rsp
# Event!` (no access point, the worker's second attempt recovered after
# 90 s). The worker resets the dongle first, then loads the module with an
# explicit `modprobe 8821cu`, which a blacklist doesn't block.
blacklist 8821cu
