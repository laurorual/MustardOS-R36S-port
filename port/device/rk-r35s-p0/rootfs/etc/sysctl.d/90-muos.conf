# M4b (S02sysctl): reboot 10 s after a panic (oops=panic is on the kernel
# command line) instead of hanging; ramoops keeps the dump and S89 saves it
# to p3 MUOS/log/pstore. Console: warnings and worse only, so driver debug
# output (8821cu efuse dumps) no longer scrolls over the screen.
kernel.panic = 10
kernel.printk = 4 4 1 7
