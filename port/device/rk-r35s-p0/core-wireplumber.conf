# RK817 on the tested BSP. No assumptions about other R35S codec revisions.
wireplumber.profiles = {
  main = {
    support.reserve-device = disabled
    monitor.alsa.reserve-device = disabled
  }
}
monitor.alsa.properties = { alsa.reserve = false }
monitor.alsa.rules = [
  {
    matches = [ { device.name = "alsa_card.platform-rk817-sound" } ]
    actions = { update-props = {
      api.alsa.use-acp = false
      api.alsa.use-ucm = false
    } }
  }
  {
    matches = [ { node.name = "~alsa_output.platform-rk817-sound.*" } ]
    actions = { update-props = {
      audio.channels = 2
      audio.position = [ FL FR ]
      api.alsa.disable-tsched = true
      api.alsa.disable-mmap = true
      api.alsa.period-size = 1024
      api.alsa.period-num = 4
      session.suspend-timeout-seconds = 0
      # M3d step 3: WirePlumber's store-stream-props hook saved the sink's
      # volume to its state file on every change, which dropped game frames
      # (12 per 14 s of steps, 1 with WirePlumber stopped). The state is on
      # tmpfs and muOS restores the volume itself: don't store it.
      state.restore-props = false
    } }
  }
]
